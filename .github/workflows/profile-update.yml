name: Update Profile Project Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update project tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import json

          username = "sudh4nshukum4r"
          url = f"https://api.github.com/users/{username}/repos?sort=pushed&per_page=100&type=owner"

          request = urllib.request.Request(
              url,
              headers={"Accept": "application/vnd.github+json"}
          )

          with urllib.request.urlopen(request) as response:
              repos = json.load(response)

          repos = [
              repo for repo in repos
              if not repo["fork"]
              and not repo["archived"]
              and repo["name"].lower() != username.lower()
          ]

          repos.sort(
              key=lambda repo: repo.get("pushed_at") or "",
              reverse=True
          )

          lines = [
              "<!-- PROJECT_TRACKER:START -->",
              "## Live Project Tracker",
              "",
              "| Project | Description | Last Updated |",
              "|---|---|---|"
          ]

          for repo in repos[:6]:
              name = repo["name"].replace("|", "\\|")
              description = (repo.get("description") or "Learning and development project").replace("|", "\\|")
              description = description.replace("\n", " ")
              updated = (repo.get("pushed_at") or "N/A")[:10]
              link = f"[{name}]({repo['html_url']})"
              lines.append(f"| {link} | {description} | {updated} |")

          lines.extend(["", "<!-- PROJECT_TRACKER:END -->"])
          tracker = "\n".join(lines)

          readme_path = "README.md"
          with open(readme_path, "r", encoding="utf-8") as file:
              readme = file.read()

          start = "<!-- PROJECT_TRACKER:START -->"
          end = "<!-- PROJECT_TRACKER:END -->"

          if start in readme and end in readme:
              before, rest = readme.split(start, 1)
              _, after = rest.split(end, 1)
              updated_readme = before + tracker + after
          else:
              updated_readme = readme.rstrip() + "\n\n" + tracker + "\n"

          with open(readme_path, "w", encoding="utf-8") as file:
              file.write(updated_readme)
          PY

      - name: Commit README if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update live project tracker"
          git push
